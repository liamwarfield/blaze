[workspace]
resolver = "2"
members = ["crates/*"]
# Vendored third-party crates are path dependencies, not members (no tests/lints run on them).
exclude = ["third_party"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
starlark = "0.14.2"
starlark_derive = "0.14.2"
starlark_map = "0.14.2"
# The WebAssembly engine of repository_ctx.execute_wasm (ruling of 2026-11-26 in docs/decisions.md).
wasmi = "1.1.0"
starlark_syntax = "0.14.2"
dupe = "0.9"
num-bigint = "0.4"
allocative = "0.3"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "2"
once_cell = "1"
parking_lot = "0.12"
rayon = "1"
# The C zlib backend (libz-sys, the system libz through pkg-config): Bazel's JDK deflates with
# the zlib its libzip.so links (the system libz.so.1 on Linux), and gzip streams Blaze writes
# where Bazel writes them (genquery `compressed_output`, command.profile.gz) must be the same
# bytes; flate2's default miniz_oxide backend compresses differently.
flate2 = { version = "1", default-features = false, features = ["zlib"] }
tar = "0.4"
xz2 = { version = "0.1", features = ["static"] }
zstd = "0.13"
bzip2 = "0.5"
sevenz-rust2 = { version = "0.25", default-features = false }
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
regex = "1"
blake3 = "1"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"
protox = "0.10"
heck = "0.5"
base64 = "0.22"
# Markdown help text to HTML (`help everything-as-html`; Bazel uses commonmark-java).
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# gRPC stack of blaze_remote (remote cache and execution): tonic on tokio, TLS by rustls (ring)
# with the webpki roots (see docs/decisions.md 2026-11-18, TLS trust).
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"
tonic-build = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
tokio-stream = { version = "0.1", features = ["net"] }
futures = "0.3"
async-trait = "0.1"
http = "1"
bytes = "1"
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }

# starlark-rust 0.14.2, vendored with Blaze's patch queue (third_party/starlark-rust/PATCHES.md).
[patch.crates-io]
starlark = { path = "third_party/starlark-rust/starlark" }
starlark_syntax = { path = "third_party/starlark-rust/starlark_syntax" }
starlark_derive = { path = "third_party/starlark-rust/starlark_derive" }
starlark_map = { path = "third_party/starlark-rust/starlark_map" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.dev.build-override]
opt-level = 3
