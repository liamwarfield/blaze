[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
starlark = "0.14.2"
starlark_derive = "0.14.2"
allocative = "0.3"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "2"
once_cell = "1"
parking_lot = "0.12"
rayon = "1"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
regex = "1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
