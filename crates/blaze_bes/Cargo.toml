[package]
name = "blaze_bes"
description = "Port of Bazel's lib/buildeventservice: the Build Event Service client (--bes_backend)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blaze_util = { path = "../blaze_util" }
blaze_vfs = { path = "../blaze_vfs" }
blaze_events = { path = "../blaze_events" }
blaze_protos = { path = "../blaze_protos" }
blaze_options = { path = "../blaze_options" }
blaze_optdefs = { path = "../blaze_optdefs" }
blaze_shell = { path = "../blaze_shell" }
blaze_bep = { path = "../blaze_bep" }
blaze_remote = { path = "../blaze_remote" }
blaze_repo_fetch = { path = "../blaze_repo_fetch" }
indexmap.workspace = true
parking_lot.workspace = true
prost.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tokio.workspace = true
tokio-stream.workspace = true

[build-dependencies]
tonic-build.workspace = true

[dev-dependencies]
blaze_remote = { path = "../blaze_remote", features = ["testing"] }

# Records the requests of a Build Event Service client (scripts-free tool; see `help`).
[[bin]]
name = "blaze-bes-logging-server"
path = "src/bin/blaze-bes-logging-server.rs"
