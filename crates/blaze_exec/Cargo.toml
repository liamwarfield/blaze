[package]
name = "blaze_exec"
description = "Port of Bazel's lib/exec (+local), lib/sandbox (Linux), lib/standalone, Spawn* and the action cache."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blaze_util = { path = "../blaze_util" }
blaze_vfs = { path = "../blaze_vfs" }
blaze_cmdline = { path = "../blaze_cmdline" }
blaze_shell = { path = "../blaze_shell" }
blaze_events = { path = "../blaze_events" }
blaze_protos = { path = "../blaze_protos" }
blaze_options = { path = "../blaze_options" }
blaze_optdefs = { path = "../blaze_optdefs" }
blaze_collect = { path = "../blaze_collect" }
# Adapters of the execution traits for blaze_actions types (see src/actions/mod.rs).
blaze_actions = { path = "../blaze_actions" }
# EVAL_STACK_SIZE / run_on_evaluation_thread for Starlark callbacks run during execution.
blaze_starlark = { path = "../blaze_starlark" }
indexmap.workspace = true
parking_lot.workspace = true
sha2.workspace = true
hex.workspace = true
libc.workspace = true
regex.workspace = true
thiserror.workspace = true
serde_json.workspace = true
prost.workspace = true
prost-types.workspace = true
zstd.workspace = true
# TestXmlOutputParser (Java uses the JDK's StAX XMLStreamReader).
quick-xml = "0.38"

[dev-dependencies]
tempfile.workspace = true
