[package]
name = "blaze_remote"
description = "Port of Bazel's lib/remote (disk cache, remote cache, remote execution, build without the bytes) and the gRPC side of lib/authandtls."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blaze_util = { path = "../blaze_util" }
blaze_vfs = { path = "../blaze_vfs" }
blaze_cmdline = { path = "../blaze_cmdline" }
blaze_events = { path = "../blaze_events" }
blaze_protos = { path = "../blaze_protos" }
blaze_options = { path = "../blaze_options" }
blaze_optdefs = { path = "../blaze_optdefs" }
blaze_collect = { path = "../blaze_collect" }
blaze_actions = { path = "../blaze_actions" }
blaze_exec = { path = "../blaze_exec" }
blaze_shell = { path = "../blaze_shell" }
blaze_repo_fetch = { path = "../blaze_repo_fetch" }
blaze_bep = { path = "../blaze_bep" }
indexmap.workspace = true
parking_lot.workspace = true
sha2.workspace = true
hex.workspace = true
libc.workspace = true
regex.workspace = true
thiserror.workspace = true
serde_json.workspace = true
prost.workspace = true
prost-types.workspace = true
zstd.workspace = true
uuid.workspace = true
base64.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures.workspace = true
async-trait.workspace = true
http.workspace = true
bytes.workspace = true
tower.workspace = true
# client-legacy: `HttpConnector`, the TCP connector tonic uses, for the channel's own connector
# (grpc::channel: the transport lifecycle).
hyper-util = { workspace = true, features = ["client-legacy"] }
# TLS of the channel's own connector, configured as tonic configures it (same versions and
# features as tonic's `tls-ring` and `tls-webpki-roots`: no new crates).
tokio-rustls = { version = "0.26.1", default-features = false, features = ["logging", "tls12", "ring"] }
webpki-roots = "1.0.10"

[build-dependencies]
tonic-build.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The integration tests use `grpc::channel::testing` (review 2026-11-19 round 2: not part of the
# production API).
blaze_remote = { path = ".", features = ["testing"] }

[features]
# `grpc::channel::testing`: channels for the in-process fake servers of the tests.
testing = []

# Test harness of scripts/remote/replay (see docs/remote.md).
[[bin]]
name = "blaze-remote-replay"
path = "src/bin/blaze-remote-replay.rs"

# Dumps a --remote_grpc_log file as JSON lines (scripts/remote/compare-grpc-log).
[[bin]]
name = "blaze-remote-grpc-log"
path = "src/bin/blaze-remote-grpc-log.rs"

# A gRPC server whose GetCapabilities fails with a given status (scripts/remote/caps-matrix).
[[bin]]
name = "blaze-remote-fake-caps"
path = "src/bin/blaze-remote-fake-caps.rs"
