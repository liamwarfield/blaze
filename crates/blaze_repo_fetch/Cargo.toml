[package]
name = "blaze_repo_fetch"
description = "Port of Bazel's Starlark-independent fetching machinery: repository cache, downloader, decompressors, PatchUtil, netrc."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blaze_util = { path = "../blaze_util" }
blaze_vfs = { path = "../blaze_vfs" }
blaze_events = { path = "../blaze_events" }
# The credential helper (authandtls/credentialhelper): runs the helper through lib/shell and reads
# `--credential_helper` options.
blaze_shell = { path = "../blaze_shell" }
blaze_optdefs = { path = "../blaze_optdefs" }
thiserror.workspace = true
indexmap.workspace = true
parking_lot.workspace = true
regex.workspace = true
hex.workspace = true
sha1.workspace = true
sha2.workspace = true
blake3.workspace = true
base64.workspace = true
libc.workspace = true
uuid.workspace = true
# The default HTTP transport (downloader/socket_transport.rs): TLS with the Mozilla roots. The
# versions and features are the ones `ureq` 2 pulled in before the transport replaced it.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
flate2.workspace = true
tar.workspace = true
xz2.workspace = true
zstd.workspace = true
bzip2.workspace = true
sevenz-rust2.workspace = true

[dev-dependencies]
tempfile.workspace = true
sevenz-rust2 = { workspace = true, features = ["compress"] }
