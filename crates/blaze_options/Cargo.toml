[package]
name = "blaze_options"
description = "Port of com.google.devtools.common.options, the client rc-file reader and BlazeOptionHandler's rc/--config handling."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blaze_util = { path = "../blaze_util" }
# Only for the `Foreign<T>` option field types (src/foreign.rs); neither crate depends on
# blaze_options.
blaze_cmdline = { path = "../blaze_cmdline" }
blaze_vfs = { path = "../blaze_vfs" }
# InvocationPolicy (invocation_policy.rs); blaze_protos does not depend on blaze_options.
blaze_protos = { path = "../blaze_protos" }
prost.workspace = true
indexmap.workspace = true
regex.workspace = true
pulldown-cmark.workspace = true

[dev-dependencies]
base64.workspace = true
blaze_protos = { path = "../blaze_protos" }
prost.workspace = true
regex.workspace = true
indexmap.workspace = true
