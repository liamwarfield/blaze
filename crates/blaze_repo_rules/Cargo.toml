[package]
name = "blaze_repo_rules"
description = "Bazel's Starlark repository rules and module extensions: repository_rule/module_extension/tag_class, repository_ctx, module_ctx, REPO_DEFINITION, REPOSITORY_DIRECTORY (RepositoryFetchFunction, marker files, repo contents cache), SINGLE_EXTENSION_EVAL, REPOSITORY_MAPPING."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blaze_util = { path = "../blaze_util" }
blaze_cmdline = { path = "../blaze_cmdline" }
blaze_vfs = { path = "../blaze_vfs" }
blaze_events = { path = "../blaze_events" }
blaze_starlark = { path = "../blaze_starlark" }
blaze_skyframe = { path = "../blaze_skyframe" }
blaze_bzlmod_model = { path = "../blaze_bzlmod_model" }
blaze_bzlmod = { path = "../blaze_bzlmod" }
blaze_repo_fetch = { path = "../blaze_repo_fetch" }
blaze_shell = { path = "../blaze_shell" }
blaze_options = { path = "../blaze_options" }
blaze_optdefs = { path = "../blaze_optdefs" }
blaze_packages = { path = "../blaze_packages" }
blaze_sky_loading = { path = "../blaze_sky_loading" }
starlark.workspace = true
starlark_syntax.workspace = true
starlark_map.workspace = true
allocative.workspace = true
dupe.workspace = true
anyhow.workspace = true
thiserror.workspace = true
indexmap.workspace = true
parking_lot.workspace = true
once_cell.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
libc.workspace = true
uuid.workspace = true
regex.workspace = true
num-bigint.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The analysis test harness (BuildViewTestCase, FakeRegistry); blaze_sky_top depends on this
# crate, so only integration tests (tests/) use it.
blaze_sky_top = { path = "../blaze_sky_top", features = ["testing"] }
