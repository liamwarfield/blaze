[package]
name = "blaze_sky_exec"
description = "Port of Bazel's execution SkyFunctions (lib/skyframe action, artifact, completion and build-driver functions) and SkyframeActionExecutor."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blaze_util = { path = "../blaze_util" }
blaze_vfs = { path = "../blaze_vfs" }
blaze_cmdline = { path = "../blaze_cmdline" }
blaze_collect = { path = "../blaze_collect" }
blaze_events = { path = "../blaze_events" }
blaze_protos = { path = "../blaze_protos" }
blaze_skyframe = { path = "../blaze_skyframe" }
blaze_actions = { path = "../blaze_actions" }
blaze_exec = { path = "../blaze_exec" }
# ThreadInterrupt: the interruptible waits of a shared action's copy (review RW-4).
blaze_shell = { path = "../blaze_shell" }
blaze_options = { path = "../blaze_options" }
blaze_optdefs = { path = "../blaze_optdefs" }
blaze_packages = { path = "../blaze_packages" }
blaze_sky_loading = { path = "../blaze_sky_loading" }
indexmap.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
libc.workspace = true

[dev-dependencies]
blaze_starlark = { path = "../blaze_starlark" }
# The in-process multi-command fixture of RewindingTest (a dev-dependency cycle through
# blaze_runtime; integration tests link one copy of this crate).
blaze_buildtool_testing = { path = "../blaze_buildtool_testing" }
tempfile.workspace = true
serde_json.workspace = true
