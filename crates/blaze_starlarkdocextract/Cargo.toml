[package]
name = "blaze_starlarkdocextract"
description = "API documentation extraction for loaded Starlark modules (lib/starlarkdocextract, starlark/common DocstringUtils): the stardoc_output ModuleInfo of starlark_doc_extract"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blaze_cmdline = { path = "../blaze_cmdline" }
blaze_packages = { path = "../blaze_packages" }
blaze_protos = { path = "../blaze_protos" }
blaze_starlark = { path = "../blaze_starlark" }
blaze_util = { path = "../blaze_util" }
starlark.workspace = true
starlark_map.workspace = true
regex.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The analysis test harness (BuildViewTestCase): .bzl files are loaded through Skyframe as in a
# build; blaze_sky_top depends on this crate, so only integration tests (tests/) use it.
blaze_actions = { path = "../blaze_actions" }
blaze_sky_top = { path = "../blaze_sky_top", features = ["testing"] }
blaze_sky_loading = { path = "../blaze_sky_loading" }
blaze_skyframe = { path = "../blaze_skyframe" }
prost.workspace = true
