[package]
name = "blaze_client"
description = "Port of the Linux parts of Bazel's C++ client (src/main/cpp): startup options, workspace detection, output/install base, locks, exit codes."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blaze_util = { path = "../blaze_util" }
blaze_options = { path = "../blaze_options" }
blaze_protos = { path = "../blaze_protos" }
md-5.workspace = true
hex.workspace = true
libc.workspace = true
tar.workspace = true
zstd.workspace = true
# The gRPC client of the persistent server (BlazeServer::Connect / Communicate): tonic on a
# tokio runtime owned by BlazeServer, message types from blaze_protos::command_server.
prost.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tokio.workspace = true
# Not a workspace dependency: pinned here (the version tonic's transport already uses, see
# Cargo.lock) to read the I/O error of a failed HTTP/2 stream (command_server.rs,
# GrpcStatus::from_tonic).
h2 = "0.4.20"

[dev-dependencies]
tempfile.workspace = true
